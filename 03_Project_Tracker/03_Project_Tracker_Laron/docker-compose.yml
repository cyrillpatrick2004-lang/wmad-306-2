services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project_tracker_app
    working_dir: /var/www/html
    command: >
      sh -lc "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
      && chown -R www-data:www-data storage bootstrap/cache database || true
      && chmod -R ug+rwX storage bootstrap/cache database || true
      && php-fpm"
    volumes:
      - ./src:/var/www/html
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "false"
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    container_name: project_tracker_nginx
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./src:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: project_tracker_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-project_tracker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-tracker}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tracker}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql

  node:
    image: node:22-alpine
    container_name: project_tracker_node
    working_dir: /var/www/html
    command: sh -lc "npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./src:/var/www/html

volumes:
  db_data:
